<style>
/* Layout: dark brand header over a seashell workspace; dashboard home, per-owner page, project and task views. */
:root{
  --ink:#F1ECE2; --shell:#1D1D1B; --paper:#242422; --card:#2B2B29; --line:#403F3B; --muted:#A39D91; color-scheme:dark;

  --bar-todo:#B9B2A4; --bar-prog:#5BA9C0; --bar-hold:#EAC119; --bar-block:#D9534F; --bar-ok:#4FA874;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F1ECE2; --shell:#1D1D1B; --paper:#242422; --card:#2B2B29; --line:#403F3B; --muted:#A39D91; --accent:#F08A52;
    --ok:#7FD3A0; --ok-bg:#1F3A2A; --prog:#8CD0E0; --prog-bg:#1E3840; --hold:#EAC119; --hold-bg:#3D3414; --block:#FF8F86; --block-bg:#46201D; --todo:#C9C3B7; --todo-bg:#33322E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F1ECE2; --shell:#1D1D1B; --paper:#242422; --card:#2B2B29; --line:#403F3B; --muted:#A39D91; --accent:#F08A52;
  --ok:#7FD3A0; --ok-bg:#1F3A2A; --prog:#8CD0E0; --prog-bg:#1E3840; --hold:#EAC119; --hold-bg:#3D3414; --block:#FF8F86; --block-bg:#46201D; --todo:#C9C3B7; --todo-bg:#33322E;
  color-scheme:dark;
}
:root{--on-accent:#1D1D1B}
/* Light version: switched on by the Appearance control in the account menu */
:root[data-mode="light"]{
  --ink:#1D1D1B; --shell:#EAE4DA; --paper:#F5F1E9; --card:#FFFFFF; --line:#DDD5C7; --muted:#6B665D; --accent:#C9531A; --on-accent:#FFFFFF;
  --ok:#2F7D4F; --ok-bg:#DDEFE3; --prog:#2B6F86; --prog-bg:#D8ECF1; --hold:#7A5E00; --hold-bg:#F7EBBC; --block:#B3261E; --block-bg:#F8D9D5; --todo:#5C5850; --todo-bg:#E7E2D8;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--shell);color:var(--ink);font:14px/1.45 Archivo,Arial,sans-serif;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:270px;max-height:70vh;overflow:auto}

.hbtn{border:1px solid #4a4944;background:none;color:#EAE4DA;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}

.asof{color:var(--muted);margin:0 0 16px;font-size:13px}

.kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}

.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--todo-bg)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.c-Completed,.c-On-Track{background:var(--ok-bg);color:var(--ok)}

.bn{display:block;width:100%;aspect-ratio:2480/480;object-fit:cover;object-position:center;border-radius:14px;border:1px solid var(--line);margin:0 0 20px;background:var(--card)}
.th{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;text-align:left}

.hhead{display:flex;flex-direction:column;gap:14px}

<script>
const STAT=['Not Started','In Progress','On Hold','Blocked','Completed'];
const PRI=['High','Medium','Low'];
const COL={'Not Started':'var(--bar-todo)','In Progress':'var(--bar-prog)','On Hold':'var(--bar-hold)','Blocked':'var(--bar-block)','Completed':'var(--bar-ok)'};
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>s?new Date(s+'T00:00:00'):null;
const fmt=s=>{const d=toD(s);return d?`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`:''};
const addedOf=t=>(t.created||'').slice(0,10)||t.start||'';
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const store=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const own=t=>t.status==='Completed'?1:t.status==='In Progress'?.5:0;
const natural=(a,b)=>{const x=a.split('.'),y=b.split('.');for(let i=0;i<Math.max(x.length,y.length);i++){if(x[i]===undefined)return -1;if(y[i]===undefined)return 1;const p=x[i].replace(/\D/g,''),q=y[i].replace(/\D/g,'');if(x[i]!==y[i]){if(i===0)return x[i]<y[i]?-1:1;return (+p||0)-(+q||0)||(x[i]<y[i]?-1:1)}}return 0};

let db=null,userNS=null,dl=null,me={id:null,name:''},canWrite=true,ready=false,loadError='';
const S={view:(location.hash.slice(1)||'dash'),pid:null,owner:'',status:'',q:'',proj:'',pri:'',req:'',due:'',since:'',sortK:'code',sortD:1,mainUser:'',hideDone:false,collapsed:new Set(),open:new Set(),showDeleted:false,mine:store('mine'),rawP:[],rawT:[],P:[],T:[],leaves:[]};
if(!['dash','boards','mine','projects','tasks','project'].includes(S.view))S.view='dash'; // 'main' landing page is switched off for now
const resetF=()=>{S.owner=S.status=S.q=S.proj=S.pri=S.req=S.due=S.since='';S.hideDone=false};
const filtersOn=()=>!!(S.owner||S.status||S.q||S.hideDone||S.proj||S.pri||S.req||S.due||S.since);
const dueOK=t=>{if(!S.due)return true;if(S.due==='none')return !t.due;const d=toD(t.due);if(!d)return false;if(S.due==='over')return t.over;const e=new Date(TODAY);e.setDate(e.getDate()+(S.due==='week'?7:30));return d>=TODAY&&d<=e};
const SORTS={added:t=>addedOf(t),task:t=>t.title.toLowerCase(),status:t=>STAT.indexOf(t.status),owner:t=>(t.owner||'~').toLowerCase(),due:t=>t.due||'9999',pri:t=>{const i=PRI.indexOf(t.pri);return i<0?9:i},project:t=>pName(t.pid).toLowerCase()};
function sortRows(rows){const f=SORTS[S.sortK];if(!f)return rows;return [...rows].sort((a,b)=>{if(S.sortK==='due'){const m=(!a.due)-(!b.due);if(m)return m}const x=f(a),y=f(b);return ((x<y?-1:x>y?1:0)*S.sortD)||natural(a.code,b.code)})}
const th=(k,l,c='')=>`<span class="${c}"><button class="th" data-sort="${k}">${l}${S.sortK===k?(S.sortD>0?' ▲':' ▼'):''}</button></span>`;

// ---------- derive ----------
function derive(){
  S.T=S.rawT.map(t=>({...t,over:false})).sort((a,b)=>natural(a.code,b.code));
  const live=S.T.filter(t=>!t.deleted);
  const parents=new Set();
  live.forEach(t=>{const p=t.code.split('.');for(let i=1;i<p.length;i++)parents.add(p.slice(0,i).join('.'))});
  const sum={},cnt={};
  live.forEach(t=>{t.depth=t.code.split('.').length-1;t.leaf=!parents.has(t.code);t.over=t.leaf&&t.status!=='Completed'&&!!t.due&&toD(t.due)<TODAY;
    if(t.leaf){const p=t.code.split('.');for(let i=2;i<=p.length;i++){const k=p.slice(0,i).join('.');sum[k]=(sum[k]||0)+own(t);cnt[k]=(cnt[k]||0)+1}}});
  live.forEach(t=>{t.pct=t.leaf?own(t):(cnt[t.code]?sum[t.code]/cnt[t.code]:0)});
  S.T.forEach(t=>{if(t.deleted){t.depth=t.code.split('.').length-1;t.leaf=true}});
  S.leaves=live.filter(t=>t.leaf);
  S.P=S.rawP.map(p=>{const L=S.leaves.filter(t=>t.pid===p.id);const pct=L.length?L.reduce((a,t)=>a+own(t),0)/L.length:0;
    const over=L.filter(t=>t.over).length,blocked=L.filter(t=>t.status==='Blocked').length;
    const health=!L.length?'':pct>=1?'Completed':blocked?'Blocked':over?'At Risk':'On Track';
    return {...p,L,pct,over,blocked,health,done:L.filter(t=>t.status==='Completed').length}}).sort((a,b)=>natural(a.id,b.id));
}
const proj=id=>S.P.find(p=>p.id===id);
const pName=id=>proj(id)?.name||id;
const TEAM=['Andre','Darys','Gina']; // people who can be picked in the account menu
const owners=()=>[...new Set([...S.rawT.map(t=>t.owner),...S.rawP.map(p=>p.owner),...TEAM].filter(Boolean))].sort();
const chip=(c,t)=>`<span class="chip c-${esc(c).replace(/ /g,'-')}">${esc(t)}</span>`;
const stSel=t=>canWrite?`<select class="chip c-${esc(t.status).replace(/ /g,'-')}" data-st="${esc(t.key)}" aria-label="Status">${STAT.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select>`:chip(t.status,t.status);

// ---------- render ----------
let BN=null; // banner image: settings/banner {url, alt}
const bannerHtml=()=>BN&&BN.url?`<img class="bn" src="${esc(BN.url)}" alt="${esc(BN.alt||'')}">`:'';
function render(){
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===(S.view==='project'?'projects':S.view))));
  $('#addbtn').hidden=!canWrite; $('#export').hidden=!ready;
  const a=$('#app');
  if(loadError){a.innerHTML=`<div class="hero-empty"><h3>Can't load the tracker data</h3><p>${esc(loadError)}</p></div>`;return}
  if(!ready){a.innerHTML=S.view==='main'?mainPage():'<div class="empty">Loading tasks…</div>';return}
  derive();
  syncHeader();
  const banner=canWrite?'':'<div class="banner">You have view-only access. You can read and export everything, but not change tasks.</div>';
  const empty=!S.rawT.length&&!S.rawP.length;
  a.innerHTML=(S.view==='main'?'':bannerHtml())+banner+(empty?emptyState():S.view==='main'?mainPage():S.view==='dash'?dash():S.view==='boards'?boards():S.view==='mine'?mine():S.view==='projects'?plist():S.view==='project'&&proj(S.pid)?pview():S.view==='tasks'?tview():dash());
  bindTools();
}
function emptyState(){return `<div class="hero-empty"><h3>No tasks yet</h3><p>Add the first project, then add tasks and subitems under it.</p>${canWrite?'<button class="btn pri" data-act="newproject">+ New project</button>':''}</div>`}
// ---------- dashboard (modular: sections can be moved, resized, hidden, renamed) ----------
let DC=null,DBN=null,ADMIN=false,EDIT=false; // DC: settings/dashboard layout, DBN: settings/dashBanner {url,alt}
const SPANS=[[12,'Full width'],[8,'Two thirds'],[6,'Half'],[4,'One third']];
const DEFHID=['owners','attention','counts','recent'];
const PAL=['#F6D5E5','#D2ECF0','#FAE9A6','#D7DBEE','#F9D3BE'];
const ICOL=['#EAC119','#EAA7C7','#9ED6DF','#ED773C'];
const DAYN=['MON','TUE','WED','THU','FRI'];
const ensureMine=()=>{const os=owners();if(!S.mine||!os.includes(S.mine))S.mine=os[0]};
const weekDays=()=>{const d=new Date(TODAY);d.setDate(d.getDate()-((d.getDay()+6)%7));return [0,1,2,3,4].map(i=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})};
const mdLabel=s=>{const d=toD(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase():''};
const listRow=t=>`<div class="attn" data-edit="${esc(t.key)}"><div><b>${esc(t.title)}</b><span class="tid">${esc(pName(t.pid))} · ${esc(t.owner||'No owner')}${t.due?' · due '+fmt(t.due):''}</span></div>${t.over?chip('Overdue','Overdue'):chip(t.status,t.status)}</div>`;
const sIcon=t=>t.status==='In Progress'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#EAC119" stroke="none"/></svg>':t.status==='On Hold'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>':t.status==='Blocked'?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C63F3E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 18L18 6"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
const MODS={
 hero:{label:'Greeting',def:12,html:()=>{const hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',first=S.mine||(me.name||'').trim().split(/\s+/)[0]||'there';

 stats:{label:'Status cards',def:12,html:()=>{ensureMine();const L=S.leaves,open=L.filter(t=>t.status!=='Completed'),days=weekDays(),a=iso(days[0]),b=iso(new Date(days[0].getTime()+6*864e5));
  const dueW=open.filter(t=>t.due&&t.due>=a&&t.due<=b),mineW=dueW.filter(t=>t.owner===S.mine).length;

  const hold=L.filter(t=>t.status==='On Hold'),oldest=hold.length?Math.max(...hold.map(t=>Math.max(0,Math.round((TODAY-toD(addedOf(t)||iso(TODAY)))/864e5)))):0;
  const card=(cls,bg,fg,l,n,s,go)=>`<button class="sc ${cls}" style="background:${bg};color:${fg}" data-go="${go}"><div>${l}</div><b>${n}</b><span class="mono">${s}</span></button>`;
  return `<div class="stg">${card('dk','#1D1D1B','#EAE4DA','Active projects',active,`${risk} need attention`,'projects')}${card('','#EAC119','#1D1D1B','Due this week',dueW.length,`${mineW} assigned to ${esc(S.mine||'you')}`,'week')}${card('','#808BC5','#1D1D1B','On hold',hold.length,hold.length?`Oldest: ${oldest} days`:'Nothing waiting','On Hold')}${card('','#C63F3E','#FFFFFF','Blocked',L.filter(t=>t.status==='Blocked').length,'Needs a decision','Blocked')}</div>`}},
 week:{label:'This week',title:'This week',def:8,html:h=>{const days=weekDays(),L=S.leaves,pidx=id=>Math.max(0,S.P.findIndex(p=>p.id===id));
  const mon=d=>d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
  const cols=days.map((d,i)=>{const ds=iso(d),items=L.filter(t=>t.due===ds).sort((x,y)=>(x.status==='Completed')-(y.status==='Completed')),today=d.getTime()===TODAY.getTime();
   const blocks=items.slice(0,4).map(t=>{const done=t.status==='Completed';return `<button class="wb" data-edit="${esc(t.key)}" style="background:${done?'#245E55':PAL[pidx(t.pid)%PAL.length]};color:${done?'#EAE4DA':'#1D1D1B'}"><b>${esc(t.title)}</b><span>${esc(t.owner||'No owner')}${t.over?' · OVERDUE':''}${done?' · DONE':''}</span></button>`}).join('')+(items.length>4?`<div class="wmore">+${items.length-4} more</div>`:'');
   return `<div class="wcol"><div class="wday ${today?'today':''}"><div>${DAYN[i]}</div><b>${d.getDate()}</b></div>${blocks}</div>`}).join('');
  return `<div class="wcard"><div class="whead"><h2 class="dh2">${esc(h)}</h2><span class="mono wr">${mon(days[0])} ${days[0].getDate()} – ${days[4].getDate()}</span></div><div class="wscroll"><div class="wgrid">${cols}</div></div></div>`}},
 mytasks:{label:'My tasks',title:'My tasks',def:4,html:h=>{ensureMine();
  const L=S.leaves.filter(t=>t.owner===S.mine&&t.status!=='Completed').sort((a,b)=>(b.over-a.over)||(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);
  const pill=t=>t.over?'<span class="pill" style="background:#C63F3E;color:#fff">Overdue</span>':t.pri==='High'?'<span class="pill" style="background:#ED773C;color:#1D1D1B">High</span>':t.pri?`<span class="pill" style="background:var(--line);color:var(--ink)">${esc(t.pri)}</span>`:'';
  return `<div class="mtcard"><div class="whead"><h2 class="dh2">${esc(h)} · ${esc(S.mine)}</h2><button class="lnk" data-view="mine">See all</button></div>${L.map(t=>`<div class="mtr" data-edit="${esc(t.key)}">${sIcon(t)}<div class="tx"><b>${esc(t.title)}</b><span class="mono">${esc(pName(t.pid))}${t.due?' · '+mdLabel(t.due):''}</span></div>${pill(t)}</div>`).join('')||'<div class="empty">Nothing open</div>'}</div>`}},
 projects:{label:'Projects',title:'Projects',def:12,html:h=>{const txt={'On Track':['In progress','#EAC119','#1D1D1B'],'At Risk':['At risk','#ED773C','#1D1D1B'],'Blocked':['Blocked','#C63F3E','#FFFFFF'],'Completed':['Done','#245E55','#EAE4DA']};
  const cs=S.P.map((p,i)=>{const x=txt[p.health]||['Planning','var(--line)','var(--ink)'],pc=Math.round(p.pct*100);
   return `<button class="pjc" data-p="${esc(p.id)}"><div class="pjt"><span class="pji" style="background:${ICOL[i%4]}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="pill" style="background:${x[1]};color:${x[2]}">${x[0]}</span></div><div class="pjn">${esc(p.name)}</div><div class="pjb"><i style="width:${pc}%;background:${p.health==='Blocked'?'#C63F3E':'var(--ink)'}"></i></div><div class="pjf mono"><span>${pc}%</span><span>${p.end?'DUE '+mdLabel(p.end):''}</span></div></button>`}).join('');
  return `<div class="whead" style="margin-bottom:14px"><h2 class="dh2">${esc(h)}</h2><button class="lnk" data-view="projects">All ${S.P.length} projects</button></div><div class="pjg">${cs}</div>`}},
 owners:{label:'Workload by owner',title:'Workload by owner',def:4,html:h=>{const L=S.leaves,ow=[...new Set(L.map(t=>t.owner||'(No owner)'))].sort();
  const bars=ow.map(o=>{const X=L.filter(t=>(t.owner||'(No owner)')===o);return `<div class="own" data-owner="${esc(o)}"><b>${esc(o)}</b><div class="stack">${STAT.map(s=>{const n=X.filter(t=>t.status===s).length;return n?`<i style="width:${n/X.length*100}%;background:${COL[s]}" title="${s}: ${n}"></i>`:''}).join('')}</div><span>${X.length}</span></div>`}).join('');
  return `<h2>${esc(h)}</h2><div class="panel">${bars}<div class="legend">${STAT.map(s=>`<span><em style="background:${COL[s]}"></em>${s}</span>`).join('')}</div></div>`}},
 attention:{label:'Needs attention',title:'Needs attention',def:8,html:h=>{const att=S.leaves.filter(t=>t.over||t.status==='Blocked'||t.status==='On Hold').sort((x,y)=>(y.over-x.over)||(x.due||'9').localeCompare(y.due||'9')).slice(0,9);
  return `<h2>${esc(h)}</h2><div class="panel">${att.map(listRow).join('')||'<div class="empty">Nothing needs attention</div>'}</div>`}},
 counts:{label:'Count cards (classic)',def:12,html:()=>{const L=S.leaves;
  const k=[['Open',L.filter(t=>t.status!=='Completed').length,'var(--bar-prog)','open'],['Overdue',L.filter(t=>t.over).length,'var(--bar-block)','over'],['Blocked',L.filter(t=>t.status==='Blocked').length,'var(--block)','Blocked'],['On Hold',L.filter(t=>t.status==='On Hold').length,'var(--bar-hold)','On Hold'],['Completed',L.filter(t=>t.status==='Completed').length,'var(--bar-ok)','Completed']];
  return `<div class="kpis">${k.map(x=>`<button class="kpi" style="--c:${x[2]}" data-go="${x[3]}"><span>${x[0]}</span><b>${x[1]}</b></button>`).join('')}</div>`}},
 recent:{label:'Recently added',title:'Recently added',def:6,html:h=>{const L=[...S.leaves].sort((a,b)=>addedOf(b).localeCompare(addedOf(a))).slice(0,8);
  return `<h2>${esc(h)}</h2><div class="panel">${L.map(listRow).join('')}</div>`}}
};function dcfg(){const c=DC||{};const order=(c.order||[]).filter(id=>MODS[id]);Object.keys(MODS).forEach(id=>{if(!order.includes(id))order.push(id)});
  return {order,hidden:new Set(c.hidden||DEFHID),span:{...(c.span||{})},titles:{...(c.titles||{})}}}
function dcfgSave(cfg){DC={order:cfg.order,hidden:[...cfg.hidden],span:cfg.span,titles:cfg.titles};render();write(()=>db.doc('settings/dashboard').set({...DC,...stamp()}),'Layout saved')}
function dashAct(a,id){const cfg=dcfg();
  if(a==='edit'){EDIT=true;render();return}
  if(a==='done'){EDIT=false;render();return}
  if(a==='reset'){DC=null;render();write(()=>db.doc('settings/dashboard').delete(),'Layout reset to default');return}
  const i=cfg.order.indexOf(id);
  if(a==='up'&&i>0)[cfg.order[i-1],cfg.order[i]]=[cfg.order[i],cfg.order[i-1]];
  else if(a==='down'&&i<cfg.order.length-1)[cfg.order[i+1],cfg.order[i]]=[cfg.order[i],cfg.order[i+1]];
  else if(a==='vis')cfg.hidden.has(id)?cfg.hidden.delete(id):cfg.hidden.add(id);
  else return;
  dcfgSave(cfg)}
function modBar(id,cfg){const m=MODS[id];
  return `<div class="mbar"><span class="mh">⋮⋮ ${esc(m.label)}</span><button data-dc="up" data-id="${id}" aria-label="Move up">↑</button><button data-dc="down" data-id="${id}" aria-label="Move down">↓</button><select data-dspan="${id}" aria-label="Width">${SPANS.map(([n,l])=>`<option value="${n}" ${(cfg.span[id]||m.def)===n?'selected':''}>${l}</option>`).join('')}</select>${m.title?`<input data-dtitle="${id}" value="${esc(cfg.titles[id]||m.title)}" aria-label="Heading" size="16">`:''}<button data-dc="vis" data-id="${id}">${cfg.hidden.has(id)?'Show':'Hide'}</button></div>`}
function dash(){
  const cfg=dcfg(),edit=EDIT&&ADMIN;
  const mods=cfg.order.filter(id=>edit||!cfg.hidden.has(id));
  const bar=edit?`<div class="ebar"><b class="sp">Customize: drag sections, or use the arrows, width and Hide buttons. Everyone sees the layout you save.</b><button class="btn" data-dc="reset">Reset to default</button><button class="btn pri" data-dc="done">Done</button></div>`:(ADMIN?'<div class="tools" style="justify-content:flex-end;margin:0 0 8px"><button class="btn" data-dc="edit">Customize</button></div>':'');
  return `${bar}<div class="dgrid">${mods.map(id=>`<section class="mod ${edit?'editing':''} ${cfg.hidden.has(id)?'ghost':''}" data-mod="${id}" style="grid-column:span ${cfg.span[id]||MODS[id].def}" ${edit?'draggable="true"':''}>${edit?modBar(id,cfg):''}${MODS[id].html(cfg.titles[id]||MODS[id].title)}</section>`).join('')}</div>`}
function cards(){return `<div class="cards">${S.P.map(p=>`<button class="pc" data-p="${esc(p.id)}"><div class="top"><h3>${esc(p.name)}</h3>${p.health?chip(p.health,p.health):''}</div><div class="prog"><i style="width:${Math.round(p.pct*100)}%"></i></div><div class="meta"><span>${Math.round(p.pct*100)}% · ${p.done}/${p.L.length} done</span><span>${esc(p.owner||'')}${p.over?` · <b style="color:var(--block)">${p.over} overdue</b>`:''}</span></div></button>`).join('')}</div>`}
function plist(){return `<div class="tools"><h2 style="margin:0;flex:1">All projects</h2>${canWrite?'<button class="btn" data-act="newproject">+ New project</button>':''}</div>${cards()}`}
function filt(rows){const q=S.q.toLowerCase();return rows.filter(t=>(!S.owner||(t.owner||'(No owner)')===S.owner)&&(!S.proj||t.pid===S.proj)&&(!S.pri||t.pri===S.pri)&&(!S.req||t.req===S.req)&&(!S.since||addedOf(t)>=S.since)&&dueOK(t)&&(!S.status||(S.status==='over'?t.over:S.status==='open'?t.status!=='Completed':t.status===S.status))&&(!q||(t.title+' '+(t.desc||'')+' '+(t.notes||'')+' '+(t.owner||'')+' '+(t.req||'')).toLowerCase().includes(q))&&(!S.hideDone||t.status!=='Completed'))}
function toolbar(){
  return `<div class="tools"><input type="search" id="q" placeholder="Search tasks and notes" value="${esc(S.q)}" aria-label="Search">
  <select id="fo" aria-label="Owner"><option value="">All owners</option>${[...new Set(S.leaves.map(t=>t.owner||'(No owner)'))].sort().map(o=>`<option ${S.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
  <select id="fs" aria-label="Status"><option value="">All statuses</option><option value="open" ${S.status==='open'?'selected':''}>Open (not completed)</option><option value="over" ${S.status==='over'?'selected':''}>Overdue</option>${STAT.map(s=>`<option ${S.status===s?'selected':''}>${s}</option>`).join('')}</select>
  ${S.view==='tasks'?`<select id="fp" aria-label="Project"><option value="">All projects</option>${S.P.map(p=>`<option value="${esc(p.id)}" ${S.proj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  <select id="fpr" aria-label="Priority"><option value="">Any priority</option>${PRI.map(s=>`<option ${S.pri===s?'selected':''}>${s}</option>`).join('')}</select>
  <select id="fr" aria-label="Requested by"><option value="">Anyone requested</option>${[...new Set(S.leaves.map(t=>t.req).filter(Boolean))].sort().map(o=>`<option ${S.req===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
  <select id="fd" aria-label="Due date"><option value="">Any due date</option><option value="over" ${S.due==='over'?'selected':''}>Overdue</option><option value="week" ${S.due==='week'?'selected':''}>Due in 7 days</option><option value="month" ${S.due==='month'?'selected':''}>Due in 30 days</option><option value="none" ${S.due==='none'?'selected':''}>No due date</option></select>
  <label>Added since <input type="date" id="fa" value="${esc(S.since)}"></label>`:''}
  <label><input type="checkbox" id="hd" ${S.hideDone?'checked':''}> Hide completed</label>
  <button class="btn" id="clr" ${filtersOn()?'':'hidden'}>Clear filters</button>
  ${S.view==='tasks'&&canWrite?`<label><input type="checkbox" id="sd" ${S.showDeleted?'checked':''}> Show deleted</label>`:''}</div>`}
function detailHtml(t){return `<div class="detail">${t.notes?esc(t.notes).replace(/ \| /g,'\n'):'<i>No notes</i>'}${t.link?`\n<b>Link:</b> ${esc(t.link)}`:''}${canWrite?`\n<button class="edit" data-edit="${esc(t.key)}">Edit this task</button>`:`\n<button class="edit" data-edit="${esc(t.key)}">View details</button>`}</div>`}
function leafRow(t,range,pad){
  let bar='';
  if(range&&t.start){const s=toD(t.start),e=toD(t.due||t.start),sp=range[1]-range[0]||1;bar=`<div class="bar-t"><i class="${esc(t.status).replace(/ /g,'-')}" style="left:${(s-range[0])/sp*100}%;width:${Math.max(1.5,(e-s)/sp*100)}%"></i>${TODAY>=range[0]&&TODAY<=range[1]?`<u style="left:${(TODAY-range[0])/sp*100}%"></u>`:''}</div>`}
  const o=S.open.has(t.key);
  return `<div class="row leaf ${t.deleted?'gone':''}"><span class="added">${esc(fmt(addedOf(t))||'—')}</span><div class="name" style="padding-left:${pad}px"><button data-t="${esc(t.key)}"><span class="car ${o?'':'closed'}">▾</span><span>${esc(t.title)}${t.deleted?' (deleted)':''}<span class="tid">${esc(t.code)}${t.req?' · for '+esc(t.req):''}</span></span></button></div>${t.deleted?'<span></span>':stSel(t)}<span class="x-owner">${esc(t.owner||'—')}</span><span class="due ${t.over?'over':''}">${t.due?fmt(t.due):'—'}${t.over?' ⚠':''}</span><span class="x-pri">${esc(t.pri||'')}</span><span class="x-last">${bar}</span>${o?detailHtml(t):''}</div>`}
function table(rows,range){
  const body=rows.map(t=>{
    if([...S.collapsed].some(c=>t.code.startsWith(c+'.')))return '';
    const pad=t.depth>1?(t.depth-1)*20:0;
    if(!t.leaf){const closed=S.collapsed.has(t.code),n=S.leaves.filter(x=>x.code.startsWith(t.code+'.')).length;
      return `<div class="row grp"><span class="added"></span><div class="name" style="padding-left:${pad}px"><button data-c="${esc(t.code)}"><span class="car ${closed?'closed':''}">▾</span><span>${esc(t.title)}<span class="tid">${esc(t.code)} · ${n} tasks</span></span></button></div><span></span><span class="x-owner"></span><span class="due">${Math.round(t.pct*100)}%</span><span class="x-pri"></span><span class="x-last"><div class="prog"><i style="width:${Math.round(t.pct*100)}%"></i></div></span></div>`}
    return leafRow(t,range,pad)}).join('');
  return `<div class="tbl wrap-x"><div class="row head"><span>Added</span><span>Task</span><span>Status</span><span class="x-owner">Owner</span><span>Due</span><span class="x-pri">Pri.</span><span class="x-last">${range?'Timeline':'Progress'}</span></div>${body||'<div class="empty">No tasks match these filters</div>'}</div>`}
function pview(){
  const p=proj(S.pid);const all=S.T.filter(t=>t.pid===p.id&&!t.deleted);
  const keep=new Set(filt(all.filter(t=>t.leaf)).map(t=>t.key));const filtered=S.owner||S.status||S.q||S.hideDone;
  const rows=all.filter(t=>t.leaf?keep.has(t.key):(!filtered||all.some(l=>keep.has(l.key)&&l.code.startsWith(t.code+'.'))));
  const dates=all.flatMap(t=>[t.start,t.due]).filter(Boolean).sort();const range=dates.length?[toD(dates[0]),toD(dates.at(-1))]:null;
  return `<button class="back" data-go="projects">← All projects</button>
  <div class="phead"><div><h1>${esc(p.name)}</h1><span class="asof">${esc(p.id)} · owner ${esc(p.owner||'')} · ${fmt(p.start)} to ${fmt(p.end)}</span></div>
  <div class="pstat"><div><b>${Math.round(p.pct*100)}%</b><span>Complete</span></div><div><b>${p.L.filter(t=>t.status!=='Completed').length}</b><span>Open</span></div><div><b style="color:var(--block)">${p.over}</b><span>Overdue</span></div><div>${p.health?chip(p.health,p.health):''}<br><span>Health</span></div>${canWrite?`<div><button class="btn pri" data-act="add" data-pid="${esc(p.id)}">+ Add task</button></div>`:''}</div></div>
  ${toolbar()}<div id="list">${table(rows,range)}</div>`}
function tview(){
  const rows=filt(S.showDeleted?S.T.filter(t=>t.leaf||t.deleted):S.leaves);
  const os=owners();if(!S.mine||!os.includes(S.mine))S.mine=os[0];
  return `<div class="mine-h"><div><span class="asof" style="display:block;margin:0 0 6px">All tasks · <span id="cnt">${rows.length}</span> shown</span><h1>${esc(S.owner||'Everyone')}</h1></div>
  <label class="who">Show <select id="who" aria-label="Show tasks for"><option value="">Everyone</option>${os.map(o=>`<option ${S.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label></div>${gtools()}<div id="list">${grid(rows)}</div>`}
function tlist(rows){
  rows=sortRows(rows);
  return `<div class="tbl wrap-x"><div class="row head">${th('added','Added')}${th('task','Task')}${th('status','Status')}${th('owner','Owner','x-owner')}${th('due','Due')}${th('pri','Pri.','x-pri')}${th('project','Project','x-last')}</div>${rows.map(t=>{const o=S.open.has(t.key);return `<div class="row leaf ${t.deleted?'gone':''}"><span class="added">${esc(fmt(addedOf(t))||'—')}</span><div class="name"><button data-t="${esc(t.key)}"><span class="car ${o?'':'closed'}">▾</span><span>${esc(t.title)}${t.deleted?' (deleted)':''}<span class="tid">${esc(t.code)}${t.owner?' · '+esc(t.owner):''}</span></span></button></div>${t.deleted?(canWrite?`<button class="btn" data-restore="${esc(t.key)}">Restore</button>`:'<span></span>'):stSel(t)}<span class="x-owner">${esc(t.owner||'—')}</span><span class="due ${t.over?'over':''}">${t.due?fmt(t.due):'—'}${t.over?' ⚠':''}</span><span class="x-pri">${esc(t.pri||'')}</span><span class="x-last" style="color:var(--muted)">${esc(pName(t.pid))}</span>${o?detailHtml(t):''}</div>`}).join('')||'<div class="empty">No tasks match these filters</div>'}</div>`}
// ---------- main page (landing + animation slot) ----------
let MN=null; // settings/main: {url, alt} of the animation (video, GIF, WebP or image)
function heroMedia(){
  if(MN&&MN.url){const vid=/video|\.(mp4|webm|mov)(\?|$)/i.test((MN.type||'')+' '+MN.url);
    return vid?`<video class="hm" src="${esc(MN.url)}" autoplay muted loop playsinline aria-label="${esc(MN.alt||'Animation')}"></video>`:`<img class="hm" src="${esc(MN.url)}" alt="${esc(MN.alt||'')}">`}
  return `<div class="hph" aria-hidden="true"><svg viewBox="0 0 64 64"><rect class="l1" x="14" y="6" width="36" height="18" rx="7" fill="#9ED6DF"/><rect class="l2" x="10" y="16" width="44" height="20" rx="7" fill="#ED773C"/><rect class="l3" x="6" y="28" width="52" height="28" rx="8" fill="#EAC119"/></svg></div>`}
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function ucard(u){
  const L=S.leaves.filter(t=>t.owner===u),open=L.filter(t=>t.status!=='Completed');
  const top=[...open].sort((a,b)=>(b.over-a.over)||(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);
  const stat=(n,l)=>`<div class="ps"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="pcard"><div class="pch"><span class="ua big">${esc(initials(u))}</span><div><h2>${esc(u)}</h2><p>${open.length} open of ${L.length} tasks</p></div><button class="pcx" data-mu="${esc(u)}" aria-label="Close profile">×</button></div>

  derive();
  const live=S.T.filter(t=>!t.deleted);

  const tRows=live.map(t=>({'Added':toD(addedOf(t))||'','ID':t.code,'Task':t.title,'Owner':t.owner||'','Requested By':t.req||'','Start':toD(t.start)||'','Due':toD(t.due)||'','Status':t.leaf?t.status:'','Priority':t.pri||'','Description':descOf(t),'Updates / Notes':updOf(t),'Link':t.link||'','Project ID':t.pid,'Project':pName(t.pid),'Level':t.depth,'Rollup %':t.pct}));

  if(MENU&&!e.target.closest('.fmenu')){MENU='';render()}
  const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;if(v==='projects'){S.view='projects'}else if(v==='week'){S.view='tasks';resetF();S.due='week'}else{S.view='tasks';resetF();S.status=v}location.hash=S.view;render();scrollTo(0,0);return}
  const p=e.target.closest('[data-p]');if(p){S.view='project';S.pid=p.dataset.p;resetF();render();scrollTo(0,0);return}
  const ow=e.target.closest('[data-owner]');if(ow&&ow.classList.contains('own')){S.view='tasks';resetF();S.owner=ow.dataset.owner;S.status='open';location.hash='tasks';render();scrollTo(0,0);return}
  const so=e.target.closest('[data-sort]');if(so){const k=so.dataset.sort;if(S.sortK===k)S.sortD*=-1;else{S.sortK=k;S.sortD=1}render();return}
  const c=e.target.closest('[data-c]');if(c){const k=c.dataset.c;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);render();return}
  const t=e.target.closest('[data-t]');if(t){const k=t.dataset.t;S.open.has(k)?S.open.delete(k):S.open.add(k);render();return}
  const ed=e.target.closest('[data-edit]');if(ed){openTask(ed.dataset.edit);return}
  const rs=e.target.closest('[data-restore]');if(rs){write(()=>db.doc('tasks/'+rs.dataset.restore).update({deleted:false,...stamp()}),'Task restored');return}
  const td=e.target.closest('[data-toggle-done]');if(td){S.showDone=!S.showDone;render();return}
  const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='add')openTask(null,{pid:a.dataset.pid,owner:a.dataset.owner});else if(a.dataset.act==='newproject')openProject();return}
  if(e.target.closest('[data-close]')||e.target.matches('[data-bg]'))closeModal();
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-st]');if(s)setStatus(s.dataset.st,s.value);
  const sp=e.target.closest('[data-dspan]');if(sp){const cfg=dcfg();cfg.span[sp.dataset.dspan]=+sp.value;dcfgSave(cfg)}
  const ti=e.target.closest('[data-dtitle]');if(ti){const cfg=dcfg();cfg.titles[ti.dataset.dtitle]=ti.value.trim();dcfgSave(cfg)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenus()}});
document.querySelectorAll('#nav [data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;if(S.view==='tasks')S.status='';location.hash=S.view;render();scrollTo(0,0)});
$('.logo').style.cursor='pointer';$('.logo').onclick=()=>{S.view='dash';location.hash='dash';render();scrollTo(0,0)};
$('#addbtn').onclick=()=>openTask(null,{pid:S.view==='project'?S.pid:'',owner:S.view==='mine'?S.mine:''});
$('#export').onclick=exportXlsx;

// ---------- header: search, notifications, account ----------
$('#kbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform||'')?'⌘K':'Ctrl K';
function setAvatar(){const n=(me.name||'').trim(),u=S.mine||n;
  $('#avatar').textContent=u?u.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase():'?';
  $('#avname').textContent=n?'Signed in as '+n:'Signed in';$('#avrole').textContent=canWrite?'Can edit tasks':'View only';
  const showSw=ADMIN||!S.linked;$('#usw').hidden=!showSw;$('#uswh').hidden=!showSw;$('#uswh').textContent=ADMIN?'Preview as (this visit only)':'Which team member are you?';
  $('#usw').innerHTML=TEAM.map(x=>`<button class="usr ${x===S.mine?'on':''}" data-asuser="${esc(x)}"><i class="ua">${esc(x[0])}</i><b>${esc(x)}</b><em>${x===S.mine?'✓':''}</em></button>`).join('')}
const attention=()=>S.leaves.filter(t=>t.over||t.status==='Blocked').sort((a,b)=>(b.over-a.over)||(a.due||'9').localeCompare(b.due||'9'));
function syncHeader(){$('#bell .dot').hidden=!attention().length;setAvatar();const gs=$('#gs');if(document.activeElement!==gs)gs.value=S.q}
function closeMenus(){$('#bellm').hidden=true;$('#avm').hidden=true}
$('#bell').onclick=e=>{e.stopPropagation();const m=$('#bellm'),open=m.hidden;closeMenus();if(open){const L=attention().slice(0,8);m.innerHTML='<div class="mh">Needs attention</div>'+(L.map(t=>`<button class="mi" data-edit="${esc(t.key)}"><b>${esc(t.title)}</b><span>${esc(pName(t.pid))}${t.due?' · due '+fmt(t.due):''}</span>${t.over?chip('Overdue','Overdue'):chip(t.status,t.status)}</button>`).join('')||'<div class="mh">Nothing needs attention</div>');m.hidden=false}};
$('#avatar').onclick=e=>{e.stopPropagation();const m=$('#avm'),open=m.hidden;closeMenus();m.hidden=!open};
$('#gs').oninput=e=>{S.q=e.target.value;if(S.view!=='tasks'){S.view='tasks';location.hash='tasks'}render()};
$('#gs').onkeydown=e=>{if(e.key==='Escape'){S.q='';e.target.value='';e.target.blur();render()}};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#gs').focus();$('#gs').select()}});
// dashboard layout drag and drop (customize mode)
document.addEventListener('dragstart',e=>{const m=e.target.closest?.('.mod.editing');if(!m||e.target.closest('input,select,textarea'))return;e.dataTransfer.setData('text/plain','mod:'+m.dataset.mod);e.dataTransfer.effectAllowed='move';m.classList.add('drag')});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.mod.editing'))e.preventDefault()});
document.addEventListener('drop',e=>{const m=e.target.closest?.('.mod.editing');if(!m)return;const d=e.dataTransfer.getData('text/plain');if(!d.startsWith('mod:'))return;e.preventDefault();const from=d.slice(4),to=m.dataset.mod;if(from===to)return;const cfg=dcfg();cfg.order.splice(cfg.order.indexOf(from),1);cfg.order.splice(cfg.order.indexOf(to),0,from);dcfgSave(cfg)});
// appearance: dark (default) or light, remembered per person
function setMode(m){document.documentElement.dataset.mode=m;try{localStorage.setItem('mode',m)}catch(e){}document.querySelectorAll('.seg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)))}
document.querySelectorAll('.seg [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
setMode(document.documentElement.dataset.mode==='light'?'light':'dark');
// drag and drop between board columns
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.kcard');if(!c||!canWrite)return;e.dataTransfer.setData('text/plain',c.dataset.key);e.dataTransfer.effectAllowed='move';c.classList.add('drag')});
document.addEventListener('dragend',()=>document.querySelectorAll('.drag,.over-col').forEach(x=>x.classList.remove('drag','over-col')));
document.addEventListener('dragover',e=>{const d=e.target.closest?.('[data-drop]');if(d&&canWrite){e.preventDefault();d.classList.add('over-col')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('[data-drop]');if(d&&!d.contains(e.relatedTarget))d.classList.remove('over-col')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('[data-drop]');if(!d||!canWrite)return;e.preventDefault();d.classList.remove('over-col');const key=e.dataTransfer.getData('text/plain'),t=S.T.find(x=>x.key===key);if(t&&t.status!==d.dataset.drop)setStatus(key,d.dataset.drop)});

// ---------- identity: tied to the signed-in account ----------
// The account's private profile doc (data/users/<id>/profile) remembers which team member this account is.
// First visit: matched by the account's first name, then remembered, so it follows the person to any browser.
async function resolveIdentity(){
  let who='';const path=me.id?'data/users/'+me.id+'/profile':'';
  try{if(path){const s=await db.doc(path).get();if(s.exists)who=s.data().who||''}}catch(e){}
  const os=owners();
  if(!who||!os.includes(who)){
    const first=(me.name||'').trim().split(/\s+/)[0].toLowerCase(),m=os.find(o=>o.toLowerCase()===first);
    who=m||'';
    if(m&&path&&canWrite){try{await db.doc(path).set({who:m})}catch(e){}}
  }
  if(who){S.mine=who;S.linked=true}else S.linked=false;
}

// ---------- boot ----------
let raf=0;const later=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(!$('#modal').firstChild||true)render()})};
(async()=>{
  try{
    const c=window.claude;
    db=c?.use?await c.use('db'):null;userNS=c?.use?await c.use('user'):null;dl=c?.use?await c.use('downloads'):null;
    if(!db){loadError='The shared database is not available in this view. Open the tracker from Claude while signed in.';render();return}
    try{me=await userNS?.me?.()||me}catch(e){}
    try{const w=await userNS?.can?.('data.write');canWrite=w!==false}catch(e){}
    setAvatar();
    if(!S.mine&&me.name){const first=(me.name||'').split(/\s+/)[0].toLowerCase();S.pendingMine=first}
    let gotP=false,gotT=false;
    const upd=()=>{if(gotP&&gotT){ready=true;if(!S.idDone){S.idDone=true;resolveIdentity().then(()=>later())}if(S.pendingMine){const m=owners().find(o=>o.toLowerCase()===S.pendingMine);if(m)S.mine=m;S.pendingMine=''}later()}};
    try{ADMIN=!!(await userNS?.canEdit?.())}catch(e){}
    try{db.doc('settings/dashboard').onSnapshot(s=>{DC=s.exists?s.data():null;later()},()=>{})}catch(e){}
    try{db.doc('settings/dashBanner').onSnapshot(s=>{DBN=s.exists?s.data():null;later()},()=>{})}catch(e){}
    try{db.doc('settings/main').onSnapshot(s=>{MN=s.exists?s.data():null;later()},()=>{})}catch(e){}
    try{db.doc('settings/banner').onSnapshot(s=>{BN=s.exists?s.data():null;if(ready)later()},()=>{})}catch(e){}
    db.collection('projects').onSnapshot(s=>{S.rawP=s.docs.map(d=>({key:d.id,...d.data()}));gotP=true;upd()},er=>{loadError='Lost connection to the tracker data ('+(er?.code||'error')+'). Reload the page.';render()});
    db.collection('tasks').onSnapshot(s=>{S.rawT=s.docs.map(d=>({key:d.id,...d.data()}));gotT=true;upd()},er=>{loadError='Lost connection to the tracker data ('+(er?.code||'error')+'). Reload the page.';render()});
  }catch(e){loadError='Something went wrong while starting the tracker.';render()}
})();
render();
</script>
